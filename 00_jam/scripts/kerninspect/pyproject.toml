[project]
name = "kerninspect"
version = "0.1.0"
description = "QEMU + gdb(Python API) 检视 FreeBSD 内核内存：ISO 启动、断点、任意物理/虚拟地址读取、页表 LA48 四级 walk、双时刻对照报告"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kerninspect = "kerninspect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kerninspect"]

[tool.uv]
package = true
